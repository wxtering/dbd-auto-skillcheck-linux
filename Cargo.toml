[package]
name = "dbd-auto-skillcheck"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
image = "0.25.5"
ash = "0.37.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
rand = "0.8"
egui = "0.35.0"

[target.'cfg(target_os = "linux")'.dependencies]
pkg-config = "0.3"
ashpd = { version = "0.13.11", features = [
    "pipewire",
    "screencast",
    "tokio",
] }
pipewire = "0.9.2"
libc = "0.2"
evdev = "0.13.2"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
windows-capture = "1.3"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wgpu", "persistence"] }

